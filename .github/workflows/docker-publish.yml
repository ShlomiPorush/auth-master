name: Build and Publish Docker Image

# A version tag publishes X.Y.Z only after every check in tests.yml passed, and never
# pushes a version that is already in GHCR, so a version tag never moves. There is no
# manual trigger. See docs/deploy.md.
on:
  push:
    tags: [ 'v*.*.*' ]

env:
  GH_REGISTRY: ghcr.io
  DOCKER_HUB_REPO: shlomip/auth-master

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One publish at a time across all tags: the published-version check and the move of
    # latest must not interleave with another run.
    concurrency:
      group: docker-publish
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag reaches the shell through the environment, never through ${{ }} in the script.
      - name: Version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Require a changelog entry
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash .github/release-notes.sh "$VERSION" > /dev/null

      # The oldest running release this image may run beside in a zero-downtime rollout.
      - name: Oldest release this image may run beside
        id: rollout
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          value=$(bash .github/rollout-from.sh "$VERSION")
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Hash docker-compose.yml
        id: compose
        run: |
          sum=$(sha256sum docker-compose.yml)
          echo "sha256=${sum%% *}" >> "$GITHUB_OUTPUT"

      # latest moves only to the highest version tag, so a release of an older line, or a run
      # that finishes after a newer release, leaves it where it is.
      - name: Is this the newest release
        id: newest
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          newest=$(git tag -l 'v*' | sed -En 's/^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$/\1/p' | sort -V | tail -n 1)
          if [ "$newest" = "$VERSION" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "latest stays: $newest is newer than $VERSION."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse a version that is already published
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/refuse-published.sh "${GH_REGISTRY}/${REPOSITORY,,}" "$VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GH_REGISTRY }}/${{ github.repository }}
            ${{ env.DOCKER_HUB_REPO }}
          flavor: |
            latest=${{ steps.newest.outputs.value }}
          tags: |
            type=semver,pattern={{version}}
          labels: |
            auth-master.rollout-from=${{ steps.rollout.outputs.value }}
            auth-master.compose-sha256=${{ steps.compose.outputs.sha256 }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          bash .github/release-notes.sh "$version" > notes.md

          {
            cat notes.md
            echo ""
            echo "## Docker images"
            echo ""
            echo '```bash'
            echo "docker pull ${DOCKER_HUB_REPO}:${version}"
            echo "docker pull ${GH_REGISTRY}/${REPOSITORY,,}:${version}"
            echo '```'
            echo ""
            echo "Built for linux/amd64 and linux/arm64."
          } > release-body.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-body.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-body.md --verify-tag
          fi
