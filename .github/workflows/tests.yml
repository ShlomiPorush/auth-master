name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r services/requirements.txt -r services/requirements-dev.txt

      # The tests generate every secret they need; no repository secrets are used.
      - name: Run Python tests
        run: python -m pytest services/tests -q

      # A file list, not the directory: Node 22 and later do not accept a directory.
      - name: Run JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(services/tests/js/*.test.js services/tests/js/*.test.cjs services/tests/js/*.test.mjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript tests found in services/tests/js/." >&2
            exit 1
          fi
          node --test "${files[@]}"

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build the image (not pushed)
        run: docker build .
