name: Tests

on:
  pull_request:
  push:
    branches: [ main ]
  # The release workflow (docker-publish.yml) runs these checks before it pushes an image.
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r services/requirements.txt -r services/requirements-dev.txt

      # A throwaway Redis for the Redis settings tests, with a password made for this run.
      - name: Start Redis for the tests
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          REDIS_PASSWORD="$password" docker run -d --name test-redis -p 127.0.0.1:6379:6379 -e REDIS_PASSWORD \
            redis:7-alpine sh -c 'exec redis-server --requirepass "$REDIS_PASSWORD"'
          for _ in $(seq 1 30); do
            if REDISCLI_AUTH="$password" docker exec -e REDISCLI_AUTH test-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "TEST_REDIS_URL=redis://:${password}@127.0.0.1:6379/0" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "Redis did not answer PING within 30 seconds." >&2
          exit 1

      # The tests generate every secret they need; no repository secrets are used.
      - name: Run Python tests
        run: python -m pytest services/tests -q

      # A file list, not the directory: Node 22 and later do not accept a directory.
      - name: Run JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(services/tests/js/*.test.js services/tests/js/*.test.cjs services/tests/js/*.test.mjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript tests found in services/tests/js/." >&2
            exit 1
          fi
          node --test "${files[@]}"

  pytest-postgres:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r services/requirements.txt -r services/requirements-dev.txt

      # A new server for each run, with a password generated here and masked in the log.
      # Not a job service container: its password would have to be written in this file.
      # Readiness is checked over TCP, which the image's temporary setup server does not open.
      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 32)"
          echo "::add-mask::$pw"
          docker run -d --name pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=auth -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=postgres \
            postgres:16-alpine > /dev/null
          ready=0
          for _ in $(seq 60); do
            if docker exec pg pg_isready -q -h 127.0.0.1 -U auth -d postgres; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "PostgreSQL did not become ready in 60 seconds." >&2
            docker logs pg >&2
            exit 1
          fi
          for db in authtest expiry_test usage_test logs_test; do
            docker exec pg psql -q -v ON_ERROR_STOP=1 -U auth -d postgres -c "CREATE DATABASE $db"
          done
          base="postgres://auth:$pw@127.0.0.1:5432"
          {
            echo "TEST_DATABASE_URL=$base/authtest"
            echo "EXPIRY_TEST_DATABASE_URL=$base/expiry_test"
            echo "USAGE_TEST_DATABASE_URL=$base/usage_test"
            echo "AUTH_TEST_POSTGRES_URL=$base/logs_test"
            # A superuser connection: the database setup tests create a database and user per test.
            echo "DBUI_TEST_ADMIN_URL=$base/postgres"
          } >> "$GITHUB_ENV"

      # Without these the PostgreSQL cases would skip, and the job would pass without them.
      - name: Run Python tests on PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for name in TEST_DATABASE_URL EXPIRY_TEST_DATABASE_URL USAGE_TEST_DATABASE_URL AUTH_TEST_POSTGRES_URL DBUI_TEST_ADMIN_URL; do
            case "${!name:-}" in
              postgres://*) ;;
              *) echo "$name does not point to PostgreSQL." >&2; exit 1 ;;
            esac
          done
          python -m pytest services/tests -q -rs

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the image (not pushed)
        run: docker build -t auth-master:ci .

      - name: Check the data directory handling of the image
        run: bash .github/image-check.sh auth-master:ci
