# Every required secret below must be set in .env. Create it once with
#   sh tools/generate-env.sh      (Linux, macOS)
#   pwsh tools/generate-env.ps1   (Windows)
# docker compose refuses to start while a required value is missing.
#
# Settings such as the time zone, log retention, the Secure cookie and the
# Redis connection are managed on the dashboard's Settings page. A variable set
# in .env overrides the saved value and locks the field there (see README.md).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Run tools/generate-env.sh or tools/generate-env.ps1}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Run tools/generate-env.sh or tools/generate-env.ps1}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    image: ghcr.io/shlomiporush/auth-master:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # The database is chosen in first-time setup (the SQLite file or a PostgreSQL
      # server) and saved in ./data/database.json; keep ./data. DATABASE_URL in .env
      # overrides that choice, for example:
      # DATABASE_URL=postgres://auth:<password>@postgres:5432/authdb
      #
      # The bundled Redis, used until a Redis connection is saved on the Settings
      # page. REDIS_URL in .env (or an override file) overrides both and locks the
      # field. For an external Redis, see "Redis connection" in README.md.
      # REDIS_PASSWORD must stay set in .env even then, because this file is
      # checked before an override.
      REDIS_DEFAULT_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Run tools/generate-env.sh or tools/generate-env.ps1}@redis:6379
      # Optional master API key with every scope. Empty or unset: no master key.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is not set. Run tools/generate-env.sh or tools/generate-env.ps1}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is not set. Run tools/generate-env.sh or tools/generate-env.ps1}
      # Passed through so that values set as stack variables (for example in
      # Portainer) reach the container, not only values in .env. See "Remote
      # access and HTTPS" in README.md.
      # The addresses of reverse proxies whose X-Forwarded-For header uvicorn trusts.
      # The default applies only when the variable is not set at all; an empty
      # value is passed as it is. The default is uvicorn's own.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS-127.0.0.1,::1}
      # Empty when not set: the Secure cookie setting on the Settings page applies.
      # true or false here overrides it and locks the field.
      COOKIE_SECURE: ${COOKIE_SECURE-}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - internal
    env_file:
      - .env

networks:
  internal:
    driver: bridge
