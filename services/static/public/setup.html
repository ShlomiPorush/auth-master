<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Initial Setup · Auth Service</title>
    <meta name="description" content="Create the first administrator account for Auth Service" />
    <style>.hidden{display:none}</style>
    <script src="/js/theme.js"></script>
    <script src="/js/head.js"></script>
  </head>
  <body class="ui ui-login" data-auth-page="setup">
    <main class="ui-login-wrap">
      <div class="ui-login-col">
        <div class="ui-login-head">
          <img class="ui-brand-logo" src="/images/favicon.svg" alt="" width="32" height="32" />
          <div>
            <h1 class="ui-h1">Initial Setup</h1>
            <p>Create the first administrator account</p>
          </div>
        </div>
        <div class="ui-banner ui-banner-warn"><div>This page is only available when no admin account exists yet.</div></div>
        <form id="f" class="ui-form" novalidate>
          <div class="ui-field">
            <label class="ui-label" for="username">Username</label>
            <input class="ui-input" id="username" name="username" required minlength="2" autofocus autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin" data-inventory="setup.username" />
          </div>
          <div class="ui-field">
            <label class="ui-label" for="password">Password (min 8 characters)</label>
            <div class="ui-pass">
              <input class="ui-input" type="password" id="password" name="password" required minlength="8" autocomplete="new-password" aria-describedby="password-caps" data-inventory="setup.password" />
              <button type="button" class="ui-icon-btn" data-show-password aria-pressed="false" aria-label="Show password" title="Show password"></button>
            </div>
            <p class="ui-caps hidden" id="password-caps" data-caps="password">Caps Lock is on</p>
          </div>
          <div class="ui-field">
            <label class="ui-label" for="bootstrap">Bootstrap token (if required)</label>
            <div class="ui-pass">
              <input class="ui-input" type="password" id="bootstrap" name="bootstrap" placeholder="Optional" autocomplete="off" aria-describedby="bootstrap-caps" data-inventory="setup.bootstrap" />
              <button type="button" class="ui-icon-btn" data-show-password aria-pressed="false" aria-label="Show password" title="Show password"></button>
            </div>
            <p class="ui-caps hidden" id="bootstrap-caps" data-caps="bootstrap">Caps Lock is on</p>
          </div>
          <p class="ui-error hidden" id="err" role="alert"></p>
          <button type="submit" class="ui-btn ui-btn-primary ui-btn-block">Continue</button>
        </form>
      </div>
    </main>
    <script src="/js/common.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth-pages.js"></script>
  </body>
</html>
