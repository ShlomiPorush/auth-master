<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>MFA Setup · Auth Service</title>
    <meta name="description" content="Set up two-factor authentication for your admin account" />
    <style>.hidden{display:none}</style>
    <script src="/js/theme.js"></script>
    <script src="/js/head.js"></script>
  </head>
  <body class="ui ui-login" data-auth-page="setup-mfa">
    <main class="ui-login-wrap">
      <div class="ui-login-col is-wide">
        <div class="ui-login-head">
          <img class="ui-brand-logo" src="/images/favicon.svg" alt="" width="32" height="32" />
          <div>
            <h1 class="ui-h1">Two-Factor Authentication</h1>
            <p>Scan the QR code with your authenticator app</p>
          </div>
        </div>
        <div id="setup-mfa-box" class="ui-form">
          <div class="ui-loading" id="setup-mfa-loading" role="status"><span class="ui-spin" aria-hidden="true"></span><p>Preparing your authenticator code...</p></div>
          <div class="ui-form hidden" id="setup-mfa-ready">
            <div class="ui-qr" id="qr" role="img" aria-label="QR code for your authenticator app"></div>
            <div class="ui-field">
              <span class="ui-label">Manual entry secret:</span>
              <div id="sec"></div>
            </div>
            <form id="f" class="ui-form" novalidate>
              <div class="ui-field">
                <label class="ui-label" for="code">6-digit code</label>
                <input class="ui-input ui-code" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required placeholder="000000" data-inventory="setupmfa.code" />
              </div>
              <p class="ui-error hidden" id="err" role="alert"></p>
              <button type="submit" class="ui-btn ui-btn-primary ui-btn-block">Verify &amp; Finish</button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script src="/js/qrcode.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth-pages.js"></script>
  </body>
</html>
