<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title data-t="loginmfa.authenticator-auth-service"></title>
    <meta name="description" content="" data-t-attr="content:loginmfa.enter-your-authenticator-code-to-sign" />
    <style>.hidden{display:none}</style>
    <script src="/js/text.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/head.js"></script>
  </head>
  <body class="ui ui-login" data-auth-page="login-mfa">
    <main class="ui-login-wrap">
      <div class="ui-login-col">
        <div class="ui-login-head">
          <img class="ui-brand-logo" src="/images/favicon.svg" alt="" width="32" height="32" />
          <div>
            <h1 class="ui-h1" data-t="loginmfa.authenticator-code"></h1>
            <p data-t="loginmfa.enter-your-6-digit-code-to"></p>
          </div>
        </div>
        <form id="f" class="ui-form" novalidate>
          <div class="ui-field">
            <label class="ui-label" for="code" data-t="loginmfa.6-digit-code"></label>
            <input class="ui-input ui-code" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus data-inventory="loginmfa.code" data-t-attr="placeholder:loginmfa.000000" />
          </div>
          <p class="ui-error hidden" id="err" role="alert"></p>
          <button type="submit" class="ui-btn ui-btn-primary ui-btn-block" data-t="loginmfa.sign-in"></button>
          <p class="ui-hint"><a id="back-to-login" href="login" data-t="loginmfa.back-to-sign-in"></a></p>
        </form>
      </div>
    </main>
    <script src="/js/common.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth-pages.js"></script>
  </body>
</html>
